# TEMPLATE ONLY. Not included in the running Apache configuration.
# Replace nursing.example.invalid in BOTH this file and cloudflared.example.yml.
# Enable only after configuring and testing Cloudflare Access with MFA.
Listen 127.0.0.1:8087
<VirtualHost 127.0.0.1:8087>
    ServerName nursing.example.invalid
    DocumentRoot "C:/xampp/htdocs/Nursing_System/config/remote-access/empty"
    Alias /Nursing_System/ "C:/xampp/htdocs/Nursing_System/"
    <Directory "C:/xampp/htdocs/Nursing_System/config/remote-access/empty">
        Require all denied
    </Directory>
    <Directory "C:/xampp/htdocs/Nursing_System">
        Options -Indexes
        AllowOverride All
        Require local
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTP_HOST} !^nursing\.example\.invalid$ [NC]
    RewriteRule ^ - [F,L]
    RewriteRule ^/?$ /Nursing_System/ [R=302,L]
    # Never expose other XAMPP applications, aliases, or administration tools.
    <LocationMatch "(?i)^/(?!Nursing_System(?:/|$))[^/]+">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)^/Nursing_System/(?:.*?/)?(?:config|database|includes|logs|storage|tools|tests|design-system|infinityfree_upload|\.[^/]+)(?:/|$)">
        Require all denied
    </LocationMatch>
    <LocationMatch "(?i)^/Nursing_System/(?:.*?/)?(?:setup\.php|[^/]*preview[^/]*)(?:/|$)">
        Require all denied
    </LocationMatch>

    # Only this loopback connector origin represents HTTPS at Cloudflare's edge.
    # No client-supplied X-Forwarded-Proto is trusted by the LAN application.
    SetEnv HTTPS on
    SetEnv NURSING_APP_ENV production
    Header always set Strict-Transport-Security "max-age=31536000"
    ErrorLog "C:/xampp/htdocs/Nursing_System/logs/tunnel-origin-error.log"
    CustomLog "C:/xampp/htdocs/Nursing_System/logs/tunnel-origin-access.log" common
</VirtualHost>
